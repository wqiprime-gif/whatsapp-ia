<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none" role="img" aria-label="OnlyChat">
  <defs>
    <radialGradient id="om-shell" cx="32%" cy="26%" r="72%" fx="32%" fy="26%">
      <stop offset="0%" stop-color="#8aebff"/>
      <stop offset="28%" stop-color="#4db8ff"/>
      <stop offset="58%" stop-color="#2478f5"/>
      <stop offset="100%" stop-color="#0b3f9c"/>
    </radialGradient>
    <linearGradient id="om-rim" x1="8" y1="10" x2="92" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#001a44" stop-opacity="0.22"/>
    </linearGradient>
    <radialGradient id="om-inner" cx="48%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#3f8ef0"/>
      <stop offset="55%" stop-color="#1a56c4"/>
      <stop offset="100%" stop-color="#082a66"/>
    </radialGradient>
    <linearGradient id="om-inner-shine" x1="22" y1="28" x2="56" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="om-dot" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f2fbff"/>
      <stop offset="100%" stop-color="#b8e8ff"/>
    </radialGradient>
    <linearGradient id="om-text" x1="118" y1="18" x2="118" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#e8f6ff"/>
      <stop offset="100%" stop-color="#2f9cff"/>
    </linearGradient>
    <filter id="om-glow" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="om-text-glow" x="-4%" y="-20%" width="108%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#1e7bff" flood-opacity="0.45"/>
    </filter>
    <filter id="om-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#0a2f7a" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g transform="translate(6 6) scale(0.9)">
    <g filter="url(#om-shadow)">
      <path fill="url(#om-shell)" d="M60 14c24.3 0 41 16.2 41 37.2 0 14.8-8.2 27.4-21.2 33.2l-4.2 17.6-14.8-11.2C34.8 88.8 19 74.2 19 51.2 19 30.2 35.7 14 60 14Z"/>
      <path fill="url(#om-rim)" d="M60 14c24.3 0 41 16.2 41 37.2 0 14.8-8.2 27.4-21.2 33.2l-4.2 17.6-14.8-11.2C34.8 88.8 19 74.2 19 51.2 19 30.2 35.7 14 60 14Z"/>
      <ellipse cx="60" cy="50" rx="27" ry="23.5" fill="url(#om-inner)"/>
      <ellipse cx="50" cy="42" rx="14" ry="8.5" fill="url(#om-inner-shine)"/>
      <g filter="url(#om-glow)">
        <circle cx="48.5" cy="52.5" r="4.6" fill="url(#om-dot)"/>
        <circle cx="60" cy="52.5" r="4.6" fill="url(#om-dot)"/>
        <circle cx="71.5" cy="52.5" r="4.6" fill="url(#om-dot)"/>
      </g>
    </g>
  </g>

  <text
    x="118"
    y="78"
    fill="url(#om-text)"
    filter="url(#om-text-glow)"
    font-family="Segoe UI, Inter, Arial, sans-serif"
    font-size="54"
    font-weight="800"
    font-style="italic"
    letter-spacing="-1.5"
  >OnlyChat</text>
</svg>
