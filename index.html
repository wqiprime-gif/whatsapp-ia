<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chamada</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #000;
    }

    video#mainVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Ajustado para cobrir a tela toda sem faixas pretas */
      background: #000;
    }

    /* Esconde qualquer barra de controle que o navegador tente forçar */
    video::-webkit-media-controls {
      display: none !important;
    }

    video::-webkit-media-controls-enclosure {
      display: none !important;
    }

    .topbar {
      position: absolute;
      top: 25px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .pill {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.2);
      padding: 6px 16px;
      border-radius: 999px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      backdrop-filter: blur(8px);
    }

    .caller-dot {
      display: none;
    }

    #callerText {
      font-size: 16px;
      font-weight: 500;
      color: #fff;
    }

    #timerText {
      font-size: 12px !important;
      color: #2bffae !important;
      font-family: -apple-system, sans-serif !important;
    }

    #statusPill {
      display: none;
    }

    .controls {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      z-index: 20;
      background: rgba(60, 60, 60, 0.8);
      padding: 10px 16px;
      border-radius: 40px;
      backdrop-filter: blur(20px);
      border: none;
    }

    .btn {
      border: 0;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      transition: all .2s ease;
      position: relative;
      border: none;
    }

    .btn:active {
      transform: scale(0.9);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .btn-danger {
      background: #ff3b30;
      border: none;
    }

    .btn-danger:hover {
      background: #e6352b;
    }

    .btn-active {
      background: #fff;
      color: #000;
    }

    .btn-label {
      display: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(900px 600px at 50% 30%, rgba(40, 60, 140, 0.25), rgba(0, 0, 0, 0.78));
      z-index: 30;
    }

    .overlay-card {
      width: min(420px, 92vw);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      padding: 22px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    }

    .overlay-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .overlay-sub {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 16px;
      line-height: 1.35;
    }

    .small {
      position: absolute;
      right: 16px;
      bottom: 90px;
      width: 120px;
      height: 180px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      display: none;
      z-index: 25;
    }

    .small video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hidden {
      display: none;
    }

    /* Chat Styles */
    .chat-container {
      position: fixed;
      bottom: 100px;
      right: 20px;
      left: 20px;
      width: auto;
      max-width: 420px;
      max-height: calc(100vh - 200px);
      min-height: 400px;
      background: rgba(30, 30, 30, 0.95);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: none;
      flex-direction: column;
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    
    @media (min-width: 640px) {
      .chat-container {
        left: auto;
        width: 420px;
      }
    }

    .chat-container.open {
      display: flex;
    }

    .chat-header {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    .chat-close {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 20px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .chat-close:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 300px;
      max-height: calc(100vh - 350px);
    }

    .chat-message {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      max-width: 85%;
      word-wrap: break-word;
    }

    .chat-message.user {
      background: rgba(139, 92, 246, 0.3);
      border: 1px solid rgba(139, 92, 246, 0.5);
      align-self: flex-end;
      color: #fff;
    }

    .chat-message.other {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      align-self: flex-start;
      color: #fff;
    }

    .chat-empty {
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
      padding: 40px 20px;
    }

    .chat-input-container {
      padding: 14px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 10px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .chat-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .chat-send {
      background: rgba(139, 92, 246, 0.8);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .chat-send:hover {
      background: rgba(139, 92, 246, 1);
    }

    .chat-send svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    .btn-chat {
      background: rgba(139, 92, 246, 0.8);
    }

    .btn-chat:hover {
      background: rgba(139, 92, 246, 1);
    }

    .btn-chat.active {
      background: rgba(139, 92, 246, 1);
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="topbar">
      <div class="pill" id="callerPill">
        <span id="callerText">Em chamada…</span>
        <span id="timerText">00:00</span>
      </div>
    </div>

    <video id="mainVideo" playsinline oncontextmenu="return false;"></video>

    <div class="small" id="selfPreviewWrap">
      <video id="selfPreview" playsinline autoplay muted></video>
    </div>

    <div class="controls">
      <button class="btn" id="micBtn" title="Microfone">
        <svg viewBox="0 0 24 24" id="micIcon">
          <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
        </svg>
        <span class="btn-label">Microfone</span>
      </button>

      <button class="btn" id="cameraBtn" title="Câmera">
        <svg viewBox="0 0 24 24" id="cameraIcon">
          <path
            d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z" />
        </svg>
        <span class="btn-label">Vídeo</span>
      </button>

      <button class="btn btn-chat" id="chatBtn" title="Chat">
        <svg viewBox="0 0 24 24">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
        </svg>
        <span class="btn-label">Chat</span>
      </button>

      <button class="btn btn-danger" id="hangupBtn" title="Encerrar">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z" />
        </svg>
        <span class="btn-label">Sair</span>
      </button>
    </div>

    <!-- Chat Container -->
    <div class="chat-container" id="chatContainer">
      <div class="chat-header">
        <div class="chat-title">Chat</div>
        <button class="chat-close" id="chatCloseBtn">×</button>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty">Nenhuma mensagem ainda</div>
      </div>
      <div class="chat-input-container">
        <input type="text" class="chat-input" id="chatInput" placeholder="Diga algo..." />
        <button class="chat-send" id="chatSendBtn">
          <svg viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="overlay hidden" id="startOverlay">
      <div class="overlay-card">
        <div class="overlay-title">Toque para iniciar</div>
        <div class="overlay-sub">
          Alguns navegadores bloqueiam autoplay com som. Clique abaixo para iniciar o vídeo.
        </div>
        <button class="btn" id="startBtn" type="button">Iniciar</button>
      </div>
    </div>

    <div class="overlay hidden" id="endedOverlay">
      <div class="overlay-card">
        <div class="overlay-title">Essa ligação foi encerrada</div>
        <div class="overlay-sub">Você pode fechar esta aba com segurança.</div>
      </div>
    </div>
  </div>

  <script src="/video.js"></script>
</body>

</html>
