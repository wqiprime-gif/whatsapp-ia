# Dependências do Chromium/Puppeteer para whatsapp-web.js no Railway
[phases.setup]
aptPkgs = [
  "fonts-liberation",
  "libappindicator3-1",
  "libasound2",
  "libatk-bridge2.0-0",
  "libatk1.0-0",
  "libgbm1",
  "libgtk-3-0",
  "libnspr4",
  "libnss3",
  "libx11-xcb1",
  "libxcomposite1",
  "libxcursor1",
  "libxdamage1",
  "libxfixes3",
  "libxi6",
  "libxrandr2",
  "libxss1",
  "libxtst6",
  "xdg-utils",
  "ca-certificates"
]

[phases.build]
cmds = [
  "npm run build",
  "cd hotbot && npx puppeteer browsers install chrome"
]
