<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Prompt - HOTBOT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }

        .btn-clear:hover {
            background: #e0e0e0;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status.loading {
            background: #cfe2ff;
            color: #084298;
            border: 1px solid #b6d4fe;
            display: block;
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
            font-size: 13px;
            color: #555;
        }

        .info-box strong {
            color: #333;
            display: block;
            margin-bottom: 8px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 24px;
            }

            textarea {
                min-height: 200px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 HOTBOT</h1>
            <p>Configurar Prompt da Modelo</p>
        </div>

        <div class="info-box">
            <strong>📋 Instruções:</strong>
            Cole aqui o prompt que a modelo deve seguir. Este prompt será salvo e usado para todas as conversas no WhatsApp.
        </div>

        <form id="promptForm">
            <div class="form-group">
                <label for="prompt">Prompt da Modelo:</label>
                <textarea
                    id="prompt"
                    name="prompt"
                    placeholder="Cole o prompt customizado aqui..."
                    required
                ></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit">✅ Salvar Prompt</button>
                <button type="reset" class="btn-clear">🔄 Limpar</button>
            </div>

            <div id="status" class="status"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('promptForm');
        const statusDiv = document.getElementById('status');
        const promptInput = document.getElementById('prompt');

        // Carregar prompt existente ao abrir a página
        window.addEventListener('load', async () => {
            try {
                const response = await fetch('/api/prompt');
                if (response.ok) {
                    const data = await response.json();
                    if (data.prompt) {
                        promptInput.value = data.prompt;
                    }
                }
            } catch (error) {
                console.error('Erro ao carregar prompt:', error);
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const prompt = promptInput.value.trim();

            if (!prompt) {
                showStatus('Por favor, cole um prompt válido!', 'error');
                return;
            }

            showStatus('⏳ Salvando prompt...', 'loading');

            try {
                const response = await fetch('/api/prompt', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus('✅ Prompt salvo com sucesso! O bot começará a usar este prompt imediatamente.', 'success');
                    setTimeout(() => {
                        statusDiv.style.display = 'none';
                    }, 5000);
                } else {
                    showStatus('❌ Erro ao salvar prompt: ' + data.message, 'error');
                }
            } catch (error) {
                showStatus('❌ Erro na conexão: ' + error.message, 'error');
            }
        });

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }
    </script>
</body>
</html>
